worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 20M;

    # ---------------------------------------------------------------
    # Backend Laravel API (PHP-FPM)
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Frontend (Vite dev server / built assets)
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API -> Laravel backend (served via PHP-FPM through the backend container)
        location ^~ /api/ {
            fastcgi_pass backend:9000;
                root /var/www/html/public;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;

            # Basic security / CORS headers (fine-tuned in Laravel config/cors.php)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Laravel static assets (storage, build) if served directly by Nginx
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            expires 30d;
            access_log off;
        }

        error_log  /var/log/nginx/academichub_error.log;
        access_log /var/log/nginx/academichub_access.log;
    }
}
