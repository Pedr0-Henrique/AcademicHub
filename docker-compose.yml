services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: academichub_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-academichub}
      - DB_USERNAME=${DB_USERNAME:-academichub}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - academichub_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: academichub_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend
    networks:
      - academichub_network

  mysql:
    image: mysql:8.0
    container_name: academichub_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-academichub}
      - MYSQL_USER=${DB_USERNAME:-academichub}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - academichub_mysql_data:/var/lib/mysql
    networks:
      - academichub_network

  nginx:
    image: nginx:stable-alpine
    container_name: academichub_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - academichub_network

networks:
  academichub_network:
    driver: bridge

volumes:
  academichub_mysql_data:
    driver: local
